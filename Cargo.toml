[workspace]
members = ["crates/domain", "crates/local-store", "crates/connectors", "crates/engine", "crates/api"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
parking_lot = "0.12"
bytes = "1"
solana-sdk = "2.3"
bincode = "1.3"
sniper-domain = { path = "crates/domain" }
sniper-store = { path = "crates/local-store" }
sniper-connectors = { path = "crates/connectors" }
sniper-engine = { path = "crates/engine" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
